server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster transfers
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets aggressively (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for all client-side routes
    # so that deep links like /product/123 don't 404 on refresh/direct access.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the entry HTML so users always get the latest assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
